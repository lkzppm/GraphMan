name: DBLP

# Rebuilds the course's collaboration network from the newest DBLP dump.
# `graphman dblp` turns the XML into the course format (the whole network
# and the network up to 2009, the course file's year), which goes to a
# release tagged with the dump's date, and into the site layout (one file
# per year, summed by the page into any year's network), which goes to
# GitHub Pages, the host the site can fetch from (release assets send no
# CORS headers). Runs monthly, and on demand with any dump URL.

on:
  schedule:
    # The monthly dump is dated the 1st and is up on DROPS within days.
    - cron: '0 6 6 * *'
  workflow_dispatch:
    inputs:
      dump:
        description: 'URL of a dblp XML dump (.xml.gz). Empty: the newest monthly snapshot on DROPS.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if this snapshot already has a release'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dblp
  cancel-in-progress: false

jobs:
  build:
    name: Convert, release, publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The course-format networks in the release besides the whole one.
      YEARS: 2009
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest snapshot
        id: source
        env:
          DUMP: ${{ inputs.dump }}
        run: |
          set -euo pipefail
          if [ -n "$DUMP" ]; then
            url="$DUMP"
            date=$(printf '%s' "$url" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
            date=${date:-$(date -u +%F)}
          else
            date=$(curl -fsSL https://dblp.org/xml/release/ \
              | grep -oE 'dblp\.xml\.[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1 | cut -d. -f3)
            [ -n "$date" ] || { echo "no snapshot found on the release page"; exit 1; }
            url="https://drops.dagstuhl.de/storage/artifacts/dblp/xml/${date%%-*}/dblp-$date.xml.gz"
          fi
          echo "snapshot $date: $url"
          {
            echo "url=$url"
            echo "date=$date"
            echo "tag=dblp-$date"
          } >> "$GITHUB_OUTPUT"

      - name: Look for an existing release
        id: existing
        env:
          TAG: ${{ steps.source.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.existing.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        if: steps.existing.outputs.skip != 'true'
        run: cargo build --release -p graphman-cli

      - name: Download the dump
        if: steps.existing.outputs.skip != 'true'
        env:
          URL: ${{ steps.source.outputs.url }}
        run: |
          curl -fL --retry 3 --retry-delay 30 -o dump.xml.gz "$URL"
          ls -l dump.xml.gz

      - name: Convert
        if: steps.existing.outputs.skip != 'true'
        env:
          URL: ${{ steps.source.outputs.url }}
          DATE: ${{ steps.source.outputs.date }}
        run: |
          ./target/release/graphman dblp dump.xml.gz --out out --years "$YEARS" --gzip \
            --site by-year --date "$DATE" --source "$URL"
          rm dump.xml.gz
          ls -l out
          du -sh by-year
          cat out/README.md

      - name: Release
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.source.outputs.tag }}
          DATE: ${{ steps.source.outputs.date }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "DBLP collaboration network, $DATE" \
            --notes-file out/README.md \
            out/*.gz out/manifest.json

      - name: Prepare the Pages site
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: node .github/scripts/dblp-site.mjs by-year site "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - if: steps.existing.outputs.skip != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.existing.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
