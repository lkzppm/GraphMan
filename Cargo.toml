[workspace]
resolver = "3"
members = ["crates/graphman", "crates/graphman-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lkzppm/GraphMan"
authors = ["Lucas <lucasppmc@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
graphman = { path = "crates/graphman" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
owo-colors = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
